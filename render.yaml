# Render 블루프린트: 백엔드(FastAPI). DB는 Supabase(외부) 사용.
# Render 대시보드 > Blueprints 로 이 리포를 연결하면 서비스가 생성된다.
# DATABASE_URL 등 sync:false 값은 대시보드에서 직접 입력한다.
services:
  - type: web
    name: myblog-api
    runtime: docker
    rootDir: back_end
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Supabase 연결 문자열을 대시보드에 입력
      - key: JWT_SECRET
        generateValue: true # Render가 랜덤 생성
      - key: ADMIN_USERNAME
        sync: false # 대시보드에서 직접 입력
      - key: ADMIN_PASSWORD
        sync: false # 대시보드에서 직접 입력
      - key: FRONTEND_ORIGIN
        sync: false # 배포된 Vercel 도메인 (예: https://myblog.vercel.app)
      - key: BACKEND_BASE_URL
        sync: false # 이 서비스의 공개 주소 (현재: https://myblog-63um.onrender.com)
      - key: GOOGLE_CLIENT_ID
        sync: false # Google OAuth 클라이언트 ID (미입력 시 소셜 로그인만 비활성)
      - key: GOOGLE_CLIENT_SECRET
        sync: false # Google OAuth 클라이언트 시크릿
      # 메일은 SMTP가 아니라 Brevo HTTP API로 보낸다.
      # 무료 플랜은 아웃바운드 SMTP 포트(25·465·587)가 막혀 있어 smtplib이 나가지 못한다.
      - key: BREVO_API_KEY
        sync: false # Brevo > SMTP & API > API Keys (미입력 시 가입·비밀번호 재설정만 비활성)
      - key: MAIL_FROM_EMAIL
        sync: false # Brevo > Senders 에 등록·인증을 마친 발신자 주소
