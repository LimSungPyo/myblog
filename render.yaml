# Render 블루프린트: 백엔드(FastAPI). DB는 Supabase(외부) 사용.
# Render 대시보드 > Blueprints 로 이 리포를 연결하면 서비스가 생성된다.
# DATABASE_URL 등 sync:false 값은 대시보드에서 직접 입력한다.
services:
  - type: web
    name: myblog-api
    runtime: docker
    rootDir: back_end
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Supabase 연결 문자열을 대시보드에 입력
      - key: JWT_SECRET
        generateValue: true # Render가 랜덤 생성
      - key: ADMIN_USERNAME
        sync: false # 대시보드에서 직접 입력
      - key: ADMIN_PASSWORD
        sync: false # 대시보드에서 직접 입력
      - key: FRONTEND_ORIGIN
        sync: false # 배포된 Vercel 도메인 (예: https://myblog.vercel.app)
      # 요청 제한이 클라이언트 IP를 X-Forwarded-For의 오른쪽에서 몇 칸 볼지.
      # Render는 앞에 프록시가 1대라 1. 로컬은 프록시가 없어서 기본값 0을 쓴다.
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: BACKEND_BASE_URL
        sync: false # 이 서비스의 공개 주소 (현재: https://myblog-63um.onrender.com)
      - key: GOOGLE_CLIENT_ID
        sync: false # Google OAuth 클라이언트 ID (미입력 시 소셜 로그인만 비활성)
      - key: GOOGLE_CLIENT_SECRET
        sync: false # Google OAuth 클라이언트 시크릿
      # 메일은 SMTP가 아니라 Brevo HTTP API로 보낸다.
      # 무료 플랜은 아웃바운드 SMTP 포트(25·465·587)가 막혀 있어 smtplib이 나가지 못한다.
      - key: BREVO_API_KEY
        sync: false # Brevo > SMTP & API > API Keys (미입력 시 가입·비밀번호 재설정만 비활성)
      - key: MAIL_FROM_EMAIL
        sync: false # Brevo > Senders 에 등록·인증을 마친 발신자 주소
      # 이미지 저장소(Supabase Storage). 글 이미지 업로드가 여기로 간다.
      - key: SUPABASE_URL
        sync: false # Supabase > Project Settings > API 의 Project URL (https://xxxx.supabase.co)
      - key: SUPABASE_SECRET_KEY
        sync: false # Supabase > Project Settings > API Keys 의 Secret key (sb_secret_...). 프론트에 넣지 말 것
      - key: SUPABASE_STORAGE_BUCKET
        value: post-images # Storage에 이 이름의 Public 버킷을 먼저 만들어 둔다
      # 로컬 폴더 저장 금지. Render 무료 인스턴스는 재배포·재시작마다 디스크가 비워져서
      # Supabase 설정을 깜빡하면 올린 이미지가 조용히 사라진다. 대신 업로드를 503으로 막는다.
      - key: ALLOW_LOCAL_UPLOADS
        value: "false"
